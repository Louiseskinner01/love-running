<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Love Running.
    Club for runners in Dublin, Ireland.
    Urban running, trail running, Dublin docklands and Phoenix Park." />
    <meta name="keywords" content="love running, run, running club, runners, Ireland, Dublin, sport, exercise" />
    <title>Love Running</title>
    <!-- this is a fav icon-->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link href="assets/css/style.css" rel="stylesheet" />

</head>
<body>
    <!-- header -->
    <header>
        <a href="index.html">
            <h1 id="logo">Love Running</h1>
        </a>
        <input type="checkbox" name="nav-toggle" id="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>
        <nav>
           <ul id="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="/gallery.html">Gallery</a></li>
            <li><a href="/signup.html" class="active">Sign Up</a></li>
        </ul> 
        </nav>
    </header>

    <!-- main content -->
    <main>
        <form id="signup-form">
            <h2>LET'S GET YOU SIGNED UP!</h2>
        <label for="first-name">First Name</label>
            <input type="text" name="" id="first-name" value="" class="text-input">
                <label for="last-name">Last Name</label>
                    <input type="text" name="" id="last-name" value="" class="text-input">
                        <label for="">Email Addess</label>
                            <input type="email" name="" id="email-address" value="" class="text-input">
        <label for="">Road</label>
            <input type="radio" name="" id="road" class="radio-buttons" checked>
                <label for="">Trail</label>
                    <input type="radio" name="" id="trail" class="radio-buttons">
                        <label for="">Both</label>
                            <input type="radio" name="" id="both" class="radio-buttons">
            <input type="submit" name="" id="" value="Let's Run!" class="join-button">
                 
                        

            
        </form>


    </main>

    <!-- footer -->
    <footer>
        <ul id="social-networks">
        <li><a href="https://facebook.com/" target="_blank" rel="noopener"><i class="fa-brands fa-facebook"></i></a></li>
        <li><a href="https://twitter.com/" target="_blank" rel="noopener"><i class="fa-brands fa-square-twitter"></i></a></li>
        <li><a href="https://instagram.com/" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i></a></li>
    </ul>
    </footer>
</body>
</html>
